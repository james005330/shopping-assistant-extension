<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CartPeek</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">CartPeek</p>
          <h1>My Bag</h1>
        </div>
        <button id="refreshButton" class="icon-button" type="button" title="새로고침" aria-label="새로고침">
          ↻
        </button>
      </header>

      <section id="status" class="status">
        장바구니 페이지를 열면 아이템이 가방 안에 담깁니다.
      </section>

      <section class="bag-section" aria-label="장바구니 가방">
        <div id="physicsStage" class="physics-stage">
          <div id="physicsItems" class="physics-items"></div>
          <div id="bagEmpty" class="bag-empty">Your cart goes here</div>
        </div>
        <div class="bag-footer">
          <div>
            <span id="bagCount">0 items</span>
          </div>
          <strong id="bagTotal">0원</strong>
        </div>
      </section>

      <section class="items" aria-label="장바구니 상품">
        <div class="section-title">
          <h2>Items</h2>
          <span><span id="itemCount">0</span>개</span>
        </div>
        <div id="itemsList" class="items-list"></div>
      </section>
    </main>

    <template id="itemTemplate">
      <article class="item">
        <img class="item-image" alt="">
        <div class="item-body">
          <p class="item-brand"></p>
          <h3 class="item-name"></h3>
          <p class="item-option"></p>
          <div class="item-meta">
            <strong class="item-price"></strong>
            <span class="item-quantity"></span>
          </div>
        </div>
      </article>
    </template>

    <script src="../../node_modules/matter-js/build/matter.min.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
